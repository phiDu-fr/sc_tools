[Nettoyage_Docker]
titre = 🧹 Nettoyer l'espace Docker
script = /home/pi/sc_tools/tools/docker_menage.sh

[WS_Bose]
titre = 🎧 Voir le flux WebSockets Bose (Python)
script = python /home/pi/sc_tools/tools/py/ws_bose.py
arg1_label = Suffixe IP de l'enceinte (ex: 65)
arg1_type = text
arg2_label = Activer les logs Debug réseau ?
arg2_type = select
arg2_options = normal,debug

[Reboot_ST]
titre = 🔄 Redémarrer SoundTouch
script = /home/pi/sc_tools/tools/rebootST.sh
arg1_label = Suffixe IP (ou "all")
arg1_type = text

[Reboot_Raspberry]
titre = ⚠️ Redémarrer le Serveur (Raspberry Pi)
script = /home/pi/sc_tools/tools/reboot_raspberry.sh

[add_sources]
titre = ➕️ Ajout de tous serveurs DLNA dans Sources.xml
script = python /home/pi/sc_tools/tools/py/auto_add_sources.py

[rebuild_minidlna]
titre = 🏗️ Reconstruire le cache de MiniDLNA
script = /home/pi/sc_tools/tools/rebuild_minidlna.sh

[Check_Presets]
titre = 📲 Vérifier les Presets d'une enceinte
script = /home/pi/sc_tools/tools/presets_check.sh
arg1_label = Suffixe IP
arg1_type = text

[Update_Presets]
titre = 🎵 Mise à jour des presets depuis le fichier Presets.xml de soundcork
script = /home/pi/sc_tools/tools/presets_update.sh
arg1_label = Suffixe IP (ou "all")
arg1_type = text

[Update_Sources]
titre = 📚 Rechargement du fichier Sources.xml après redémarrage depuis le fichier Sources.xml de soundcork
script = /home/pi/sc_tools/tools/sources_update.sh
arg1_label = Suffixe IP (ou "all")
arg1_type = text

[Change_Account]
titre = 🆔 Changer Account ID
script = /home/pi/sc_tools/tools/change_accountId.sh
arg1_label = Suffixe IP (ex: 65)
arg1_type = text
arg2_label = Nouvel ID
arg2_type = text

[change_cfg]
titre = 🔧 Mise à jour sécurisée des fichiers de configuration Docker
script = /home/pi/sc_tools/tools/change_cfg.sh

[change_ip]
titre = 🌐 Adapter la config Soundcork et Stocholm au réseau local
script = /home/pi/sc_tools/tools/change_ip.sh

[change_marge]
titre = 🔊 Changer la config de toutes les enceintes Soundtouch allumées
script = /home/pi/sc_tools/tools/change_marge.sh

[create_data]
titre = 🗃️ Créer la base de données Soundcork dans dataX
script = /home/pi/sc_tools/tools/create_data.sh

[control_data]
titre = 🌟 Vérifie la base de données Soundcork dans dataX
script = /home/pi/sc_tools/tools/control_data.sh

[discoverST]
titre = 🔭 Recherche enceintes sur le réseau
script = /home/pi/sc_tools/tools/discoverST.sh
arg1_label = Méthodes : -m = mDNS | -f force brute | -b les 2
arg1_type = select
arg1_options = -m,-f,-b

[scanLan]
titre = 🕵️ Scanne le réseau
script = /home/pi/sc_tools/tools/scanLan.sh

[send_key]
titre = 💡 Envoi une commande à une enceinte
script = /home/pi/sc_tools/tools/send_key.sh
arg1_label = Suffixe IP Enceinte (ex: 66)
arg1_type = text
arg2_label = Key (PRESET_4, POWER, SHUFFLE_ON, VOLUME_DOWN, ...)
arg2_type = text
arg3_label = Etat (press, release, both)
arg3_type = select
arg3_options = press, release, both

[ST10stereo]
titre = 👯 Jumelle 2 enceintes ST10 en stéréo
script = /home/pi/sc_tools/tools/ST10stereo.sh
arg1_label = Suffixe IP ST10 Gauche (ex: 65)
arg1_type = text
arg2_label = Suffixe IP ST10 Droite (ex: 66)
arg2_type = text
arg3_label = Nom de la paire (ex: Salon)
arg3_type = text

[create_remote_services]
titre = 💾 Créé la clé USB root (insérer clé avant)
script = /home/pi/sc_tools/tools/create_remote_services.sh

[setup_audio_daemon]
titre = Configure et force le démarrage du serveur audio en mode headless (sans IHM) pour le Raspberry Pi
script = /home/pi/sc_tools/setup_audio_daemon.sh

[reset_bt]
Titre = Force la réinitialisation complète de la pile Bluetooth sur Raspberry Pi
script = /home/pi/sc_tools/reset_bt.sh

